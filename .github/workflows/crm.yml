name: CRM Telegram

# Lancé par le CRM (Cloudflare) à chaque action : connexion d'un compte, annonce, synchro des groupes...
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Numéro de la tâche (donné par le CRM)"
        required: true

run-name: "CRM · tâche ${{ inputs.job_id }}"

jobs:
  tache:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python crm.py "${{ inputs.job_id }}"
        env:
          CRM_URL: ${{ secrets.CRM_URL }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
